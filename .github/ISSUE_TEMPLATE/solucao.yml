name: Solução de rejeição
description: Enviar como resolver uma rejeição da SEFAZ no sistema
title: "[Rejeição] "
labels: ["contribuição"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir! Se for aprovada, a solução aparece no **Meu Suporte** para todos na próxima versão.
  - type: input
    id: codigo
    attributes:
      label: Código da rejeição
      placeholder: "176"
    validations:
      required: true
  - type: input
    id: mensagem
    attributes:
      label: Mensagem da SEFAZ
      placeholder: "IE do local de entrega não informada"
  - type: textarea
    id: solucao
    attributes:
      label: Como resolver no sistema
      description: Passo a passo do que fazer no sistema para resolver.
    validations:
      required: true
  - type: input
    id: autor
    attributes:
      label: Seu nome (opcional)
